name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build: build:ci:win
          # macos-15 — это Apple Silicon (arm64), НЕ Intel. Intel-раннеры имеют суффикс -intel.
          - os: macos-15
            build: build:ci:mac:arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --legacy-peer-deps

      - run: npm run ${{ matrix.build }}

      - name: Show built artifacts
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: dist/RodjerCloud-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: ls -la

      - name: Create or update release
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"

          # Заметки к релизу лежат в репозитории (RU + EN через разделитель).
          # Файл есть не всегда — тогда используем сообщение последнего коммита.
          if [ -f .github/latest-release-notes.md ]; then
            cp .github/latest-release-notes.md generated_notes.md
          else
            {
              echo "## Что нового в ${TAG}"
              echo ""
              git log -1 --pretty=%B
            } > generated_notes.md
          fi

          assets=()
          for f in *.exe *.blockmap *.dmg *.zip *.yml; do
            if [ -e "$f" ]; then assets+=("$f"); fi
          done

          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            # Delete all old assets
            gh api "/repos/RodjerYan/RodjerCloud/releases/${TAG}/assets" --jq '.[].name' | while read asset; do
              gh release delete-asset "$TAG" "$asset" --yes 2>/dev/null || true
            done
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$TAG" "${assets[@]}" --clobber
            fi
            gh release edit "$TAG" -F generated_notes.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              -F generated_notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

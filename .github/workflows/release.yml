name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build: build:ci:win
            glob: '*.exe*'
          - os: macos-latest
            build: build:ci:mac:arm64
            glob: '*.dmg*'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --legacy-peer-deps

      - run: npm run ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: dist/${{ matrix.glob }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: ls -la

      - name: Create or update release
        run: |
          git log -1 --pretty=%B > commit_msg.txt
          echo "## Что нового в ${{ github.ref_name }}" > generated_notes.md
          echo "" >> generated_notes.md
          cat commit_msg.txt >> generated_notes.md
          
          if gh release view "${{ github.ref_name }}" --json tagName > /dev/null 2>&1; then
            # Delete all old assets
            gh api "/repos/RodjerYan/RodjerCloud/releases/${{ github.ref_name }}/assets" --jq '.[].name' | while read asset; do
              gh release delete-asset "${{ github.ref_name }}" "$asset" --yes 2>/dev/null || true
            done
            gh release upload "${{ github.ref_name }}" *.exe *.exe.blockmap *.dmg *.dmg.blockmap --clobber || true
            gh release edit "${{ github.ref_name }}" -F generated_notes.md || true
          else
            gh release create "${{ github.ref_name }}" *.exe *.exe.blockmap *.dmg *.dmg.blockmap \
              --title "${{ github.ref_name }}" \
              -F generated_notes.md || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
